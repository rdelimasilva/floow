name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  # Uma execução por branch: um push novo cancela a anterior ainda em andamento.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Testes
        run: pnpm test

      # Não há step de lint: nenhum pacote define o script `lint`, e `pnpm lint`
      # hoje executa zero tarefas. Acrescente-o aqui quando os pacotes tiverem
      # o script — um step que não roda nada só simula cobertura.
